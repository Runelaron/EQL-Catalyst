name: Windows release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build, test and package
        run: python scripts/build-release.py --bootstrap-compiler
      - name: Source and payload privacy gates
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts -Force | Out-Null
          python scripts/privacy-audit.py . --private-root "$pwd" --software-version 10.0.0.0 --software-version 10.1.0.0 --software-version 10.0.13.0 --report artifacts/privacy-source.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$versionXml=Get-Content Version.props
          $releaseVersion=$versionXml.Project.PropertyGroup.VersionPrefix+'-'+$versionXml.Project.PropertyGroup.VersionSuffix
          python scripts/privacy-audit.py "dist/EQL-Catalyst-$releaseVersion-win-x64" --private-root "$pwd" --software-version 10.0.0.0 --software-version 10.1.0.0 --software-version 10.0.13.0 --report artifacts/privacy-payload.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($package in Get-ChildItem dist/*.zip,dist/*-setup.exe) {
            python scripts/privacy-audit.py $package.FullName --private-root "$pwd" --software-version 10.0.0.0 --software-version 10.1.0.0 --software-version 10.0.13.0 --report ("artifacts/privacy-"+$package.Name+".json")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Disposable-runner installer checks
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Installer (Resolve-Path dist/*-setup.exe)
      - name: Progress and update interface checks
        shell: pwsh
        run: |
          [xml]$v=Get-Content Version.props
          $version=$v.Project.PropertyGroup.VersionPrefix+'-'+$v.Project.PropertyGroup.VersionSuffix
          $output=Join-Path $env:RUNNER_TEMP 'eql-beta16-review'
          $p=Start-Process -FilePath "dist/EQL-Catalyst-$version-win-x64/EQLTracker.exe" -ArgumentList @('--preview',$output,'--beta16-review', '--icon-candidates', (Join-Path $pwd 'docs/previews/pet-icon-candidates'),'--offline','--checks-only') -WindowStyle Hidden -PassThru
          if (!$p.WaitForExit(240000)) { throw 'UI checks did not finish' }
          if ($p.ExitCode -ne 0 -or !(Test-Path "$output/beta16-checks.json") -or (Test-Path "$output/validation-failure.json")) { throw 'UI checks failed' }
          Copy-Item "$output/beta16-checks.json" artifacts/beta16-checks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/packages.json
            artifacts/*.json
          if-no-files-found: error
          retention-days: 14
  attest:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-artifacts
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/dist/*
