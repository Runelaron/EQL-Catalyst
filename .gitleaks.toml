[extend]
useDefault = true

[[allowlists]]
description = "Exact SHA-256 DLL entries in the independently verified file-hash manifest; not credentials"
condition = "AND"
paths = ['''(?:^|/)release-manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9._/-]+\.dll": "[a-f0-9]{64}",?\s*$''']
