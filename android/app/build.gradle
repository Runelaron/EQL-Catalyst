plugins { id 'com.android.application' }
android {
    namespace 'com.eqlcatalyst.companion'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig { applicationId 'com.eqlcatalyst.companion.beta'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0-beta'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    signingConfigs {
        beta {
            if (System.getenv('CATALYST_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('CATALYST_ANDROID_KEYSTORE'))
                storePassword System.getenv('CATALYST_ANDROID_STORE_PASSWORD')
                keyAlias 'catalyst-beta'
                keyPassword System.getenv('CATALYST_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.review' }
        release { signingConfig signingConfigs.beta; minifyEnabled false; debuggable false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
