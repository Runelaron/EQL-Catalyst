<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalyst companion</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><header><span class="brand">Catalyst</span><span class="beta">Companion beta</span><p id="context">Pair with your PC</p><p id="status" role="status">Connecting…</p></header>
<main><section id="pair" hidden><h1>Connect to Catalyst</h1><p>Generate a browser pairing link in Settings → Phone on your PC. A trusted certificate and matching hostname are required.</p><label>Device name <input id="name" maxlength="64" value="Browser companion" autocomplete="off"></label><button id="request">Request pairing</button><p id="pair-status"></p></section>
<nav aria-label="Companion destinations"><button data-view="build" aria-pressed="true">Build</button><button data-view="goals" aria-pressed="false">Goals</button><button data-view="session" aria-pressed="false">Session</button></nav>
<section id="content" aria-live="polite"></section><section id="history"><button id="history-more">More session history</button><div id="history-results"></div></section><section id="lookup"><label>Find in shared details <input id="search" maxlength="100" placeholder="Item, goal, or finding"></label><div id="results"></div><button id="more" hidden>More results</button></section>
<footer><p id="freshness">No snapshot received</p><p>Read-only · calculated by Catalyst on your PC</p><button id="disconnect">Unpair this browser</button></footer></main></body></html>
